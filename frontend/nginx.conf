# ============================================================
# 前端Nginx配置 - 生产环境
# - SPA History模式路由支持
# - API反向代理到后端容器
# - 静态资源缓存优化
# ============================================================

server {
    listen 80;
    server_name _;

    # 根目录
    root /usr/share/nginx/html;
    index index.html;

    # 日志
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ============================================================
    # API反向代理 -> 后端容器
    # Docker Compose中后端服务名为 backend ,端口5000
    # ============================================================
    location /api/ {
        # 转发到后端容器
        proxy_pass http://backend:5000/api/;

        # 超时设置（RAG检索可能较慢）
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 传递真实IP和协议
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓冲区设置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 128k;

        # WebSocket支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================================
    # 静态资源缓存 - JS/CSS/图片/字体
    # ============================================================
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|map|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ============================================================
    # SPA路由回退 (History模式)
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止隐藏文件访问
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
