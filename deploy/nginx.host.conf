# ============================================================
# 外层 Nginx 配置（云服务器宿主机入口，可选）
# 作用: 80->443跳转、HTTPS(Let's Encrypt)、限流、日志
#
# 如果你的云服务器还需要承载其他服务，
# 就把这个配置放到宿主机的 /etc/nginx/conf.d/ 下
# ============================================================

# 1. HTTP 跳转到 HTTPS
server {
    listen 80;
    server_name your-domain.com;  # TODO: 替换为你的域名

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 主入口
server {
    listen 443 ssl http2;
    server_name your-domain.com;  # TODO: 替换为你的域名

    # SSL 证书 (使用 Let's Encrypt 免费申请)
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 日志
    access_log /var/log/nginx/gaokao-access.log;
    error_log  /var/log/nginx/gaokao-error.log warn;

    # 上传文件大小限制
    client_max_body_size 10M;

    # ============================================================
    # 转发到 Docker 内的前端服务 (docker-compose 暴露的 80 端口)
    # 前端容器内部已将 /api/* 转发给后端容器
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:8080;  # TODO: 如前端用了其他端口请改这里
        proxy_http_version 1.1;

        # 超时
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

        # 真实IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 额外安全: 禁止访问 .env、.git 等敏感文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
