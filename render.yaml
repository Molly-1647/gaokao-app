services:
  - type: web
    name: gaokao-app
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:create_app('production') --workers 1 --bind 0.0.0.0:$PORT --timeout 60
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_CONFIG
        value: production
      - key: FORCE_TFIDF
        value: "1"
      - key: TZ
        value: Asia/Shanghai
      - key: SECRET_KEY
        generateValue: true
